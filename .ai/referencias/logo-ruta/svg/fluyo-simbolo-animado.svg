<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" class="fyr"><style>
.fyr{overflow:hidden}
.fyr .pan{animation:fyr-pan 4.8s cubic-bezier(.45,0,.2,1) infinite}
.fyr .old{animation:fyr-old 4.8s ease infinite}
.fyr .n2{transform-box:fill-box;transform-origin:center;animation:fyr-n2 4.8s ease infinite}
.fyr .n3{transform-box:fill-box;transform-origin:center;opacity:0;animation:fyr-n3 4.8s cubic-bezier(.2,0,0,1) infinite}
.fyr .r2{stroke-dasharray:52;stroke-dashoffset:52;animation:fyr-r2 4.8s cubic-bezier(.45,0,.2,1) infinite}
.fyr .tok{offset-path:path("M22 16 H36 V48 H42");offset-rotate:0deg;offset-distance:50%;animation:fyr-tok 4.8s infinite}
@keyframes fyr-tok{0%{offset-distance:50%;opacity:1;animation-timing-function:cubic-bezier(.45,0,.55,1)}17%{opacity:1}19%{offset-distance:100%;opacity:0}46%{offset-distance:0%;opacity:0;animation-timing-function:cubic-bezier(.45,0,.55,1)}49%{opacity:1}67%,100%{offset-distance:50%;opacity:1}}
@keyframes fyr-pan{0%,23%{transform:translate(0,0)}48%,100%{transform:translate(-36px,-32px)}}
@keyframes fyr-old{0%,23%{opacity:1}38%,100%{opacity:0}}
@keyframes fyr-n2{0%,18%{fill-opacity:1;transform:scale(1)}20.5%{transform:scale(1.14)}23%{fill-opacity:1;transform:scale(1)}44%,100%{fill-opacity:0;transform:scale(1)}}
@keyframes fyr-n3{0%,26%{opacity:0;transform:scale(.4)}44%,100%{opacity:1;transform:scale(1)}}
@keyframes fyr-r2{0%,25%{stroke-dashoffset:52}45%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fyr *{animation:none!important}.fyr .old,.fyr .n3{opacity:1}.fyr .n3,.fyr .r2{display:none}}
</style><g class="pan">
<g class="old"><rect x="6" y="8" width="16" height="16" rx="4" stroke="#16150f" stroke-width="3.5"/><path d="M22 16 H36 V48 H42" stroke="#16150f" stroke-width="3.5"/></g>
<rect class="n2" x="42" y="40" width="16" height="16" rx="4" fill="#16150f" stroke="#16150f" stroke-width="3.5"/>
<path class="r2" d="M58 48 H72 V80 H78" stroke="#16150f" stroke-width="3.5"/>
<rect class="n3" x="78" y="72" width="16" height="16" rx="4" fill="#16150f"/>
</g>
<circle class="tok" cx="0" cy="0" r="5.5" fill="#a33a22"/></svg>
