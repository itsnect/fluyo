<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="viewer.docTitle">Diagrama compartido · Fluyo</title>

<!-- Discoverability (FLUYO-003 §5/§9): el share es una capability URL pública,
     no un contenido que deba indexarse. El snapshot viaja exclusivamente en #d=; no existe backend. -->
<meta name="robots" content="noindex, nofollow">
<!-- Referrer-Policy explícita: la ruta /s/<id> no debe filtrarse en el
     Referer de peticiones a terceros. No se depende del default del navegador. -->
<meta name="referrer" content="no-referrer">
<!-- CSP del viewer (FLUYO-003 §8). frame-ancestors solo se puede fijar por
     cabecera HTTP: depende del hosting estático existente. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; object-src 'none'; base-uri 'none'">
<meta name="theme-color" content="#F2EDE3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161616'/%3E%3Ccircle cx='18' cy='32' r='7' fill='%23d08b5b'/%3E%3Ccircle cx='40' cy='32' r='5' fill='%23d08b5b' opacity='.65'/%3E%3Ccircle cx='54' cy='32' r='3.4' fill='%23d08b5b' opacity='.35'/%3E%3C/svg%3E">
<!-- FLUYO-018.14a: el Viewer usa el mismo sistema visual que el editor (tokens, voces, componentes), con las
     fuentes servidas desde este origen. La CSP sigue igual: sin estilos inline, sin terceros (font-src cae en 'self'). -->
<link rel="preload" href="../assets/fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/identity.css">
<link rel="stylesheet" href="../css/system.css">
<link rel="stylesheet" href="../css/share.css">
</head>
<body>

<!-- Iconos: el mismo trazo que el editor. Se oculta con la clase .sprite (share.css): la CSP no admite style inline. -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
  <symbol id="i-present" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="1.5"/><path d="M10.5 8.3v5l4-2.5z"/><path d="M12 17v3M8.5 20h7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4M4 20l1-4.5L15.5 5a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L8.5 19z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <!-- FLUYO-018.18: el transporte de la Historia, con los mismos iconos que el editor. -->
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
  <symbol id="i-step-back" viewBox="0 0 24 24"><path d="M7 6v12"/><path d="M18 6.5v11L9.5 12z"/></symbol>
  <symbol id="i-step-fwd" viewBox="0 0 24 24"><path d="M17 6v12"/><path d="M6 6.5v11l8.5-5.5z"/></symbol>
</svg>

<header id="chrome">
  <a class="logo" href="../" title="Fluyo" aria-label="Fluyo">flu<b>yo</b><span class="dots" aria-hidden="true"><span></span><span></span><span></span></span></a>
  <nav id="pgTabs" aria-label="Páginas del diagrama" data-i18n-aria-label="viewer.pages" hidden></nav>
  <!-- FLUYO-018.18: en el teléfono las páginas son un selector (la cabecera queda en una fila). -->
  <select id="pgSelect" aria-label="Página del diagrama" data-i18n-aria-label="viewer.page" hidden></select>
  <div class="tools">
    <button id="btnFit" type="button" class="iconBtn btnGhost" disabled title="Encajar el diagrama en la vista" aria-label="Encajar el diagrama en la vista" data-i18n-title="viewer.fit" data-i18n-aria-label="viewer.fit"><svg class="ic" aria-hidden="true"><use href="#i-fit"/></svg></button>
    <button id="btnZoomOut" type="button" class="iconBtn btnGhost" disabled title="Alejar" aria-label="Alejar" data-i18n-title="view.zoomOut" data-i18n-aria-label="view.zoomOut"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg></button>
    <button id="btnZoomIn" type="button" class="iconBtn btnGhost" disabled title="Acercar" aria-label="Acercar" data-i18n-title="view.zoomIn" data-i18n-aria-label="view.zoomIn"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
    <span class="vdivider" aria-hidden="true"></span>
    <button id="btnPresent" type="button" class="btnGhost" disabled title="Presentar las páginas como diapositivas" aria-label="Presentar" data-i18n-title="viewer.presentHint" data-i18n-aria-label="present.start"><svg class="ic" aria-hidden="true"><use href="#i-present"/></svg><span class="lbl" data-i18n="present.start">Presentar</span></button>
    <button id="btnOpen" type="button" disabled class="primary" title="Abrir una copia editable de este diagrama en el editor" aria-label="Abrir en Fluyo" data-i18n-title="viewer.openHint" data-i18n-aria-label="viewer.open"><svg class="ic" aria-hidden="true"><use href="#i-edit"/></svg><span class="lbl" data-i18n="viewer.openShort">Abrir<span class="lblRest" data-i18n="viewer.openRest"> en Fluyo</span></span></button>
  </div>
</header>

<main id="wrap">
  <canvas id="sv"></canvas>
  <!-- FLUYO-018.18 (D4): la Historia se cuenta SOBRE el lienzo (qué Historia, qué momento, su consecuencia, el progreso), como en
       el editor y en Present. Alto fijo; baja al pie si el destino del momento queda debajo (viewer.js, storyPlace). -->
  <div id="stNow" class="stNow" hidden>
    <div id="stKicker" class="stKicker" data-i18n="story.group">Historia</div>
    <div class="stLine"><span id="stTitle" class="stTitle"></span><span id="stCaption" class="stCaption" role="status"></span><span id="stSummary" class="stSummary"></span><span id="stProgress" class="stProgress"></span></div>
    <!-- SCENARIOS-SEMANTICS-001 FASE 5 (D7, decisión 246): la línea de estado de la ruta observada, en el rótulo (la banda sigue siendo
         solo el transporte). Solo reproduciendo y con par resuelto; sin bandera. -->
    <div id="stFlow" class="stFlow" role="status" hidden></div>
  </div>
  <!-- Presentación: la Historia y las páginas son dos grupos, y la salida es una (FLUYO-018.18, D8). El transporte de la
       banda (#stActions) se muda aquí mientras se presenta: mismos botones, misma lógica. -->
  <div id="prBar" class="inverse" hidden>
    <div id="prStory" class="prGroup" role="group" aria-label="Historia" data-i18n-aria-label="story.group" hidden></div>
    <div id="prPages" class="prGroup" role="group" aria-label="Páginas" data-i18n-aria-label="present.pages">
      <button id="prPrev" type="button" title="Página anterior" aria-label="Página anterior" data-i18n-title="present.pagePrev" data-i18n-aria-label="present.pagePrev"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg><span class="lbl" data-i18n="present.prev">Anterior</span></button>
      <span id="prPos"></span>
      <button id="prNext" type="button" title="Página siguiente" aria-label="Página siguiente" data-i18n-title="present.pageNext" data-i18n-aria-label="present.pageNext"><span class="lbl" data-i18n="present.next">Siguiente</span><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
    </div>
    <button id="prExit" type="button" title="Salir de la presentación" data-i18n-title="present.exitLong" data-i18n="present.exit"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>Salir</button>
  </div>
  <div id="status" role="status"></div>
</main>

<!-- Historia compartida (FLUYO-014). Se muestra sólo si la página tiene una Historia. FLUYO-018.18: la banda es SOLO el
     transporte, en una fila de alto fijo (el lienzo ya no salta al aparecer una consecuencia): Reproducir · Pausar/Reanudar ·
     momento anterior/siguiente · Detener. «Abrir en Fluyo» está en la cabecera. -->
<section id="story" aria-label="Historia" data-i18n-aria-label="story.group" hidden>
  <div id="stActions" class="stActions">
    <button id="stPrev" type="button" class="iconBtn" hidden aria-label="Momento anterior" title="Momento anterior" data-i18n-title="story.momentPrev" data-i18n-aria-label="story.momentPrev"><svg class="ic" aria-hidden="true"><use href="#i-step-back"/></svg></button>
    <button id="stPlay" type="button" class="primary" data-i18n="story.playStory">▶ Reproducir historia</button>
    <button id="stPause" type="button" hidden data-i18n="story.pause"><svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg>Pausar</button>
    <button id="stNext" type="button" class="iconBtn" hidden aria-label="Momento siguiente" title="Momento siguiente" data-i18n-title="story.momentNext" data-i18n-aria-label="story.momentNext"><svg class="ic" aria-hidden="true"><use href="#i-step-fwd"/></svg></button>
    <button id="stStop" type="button" hidden data-i18n="story.stop">■ Detener</button>
    <button id="stOpen" type="button" hidden title="Abrir una copia editable de este diagrama en el editor" data-i18n-title="viewer.openHint" data-i18n="viewer.open">Abrir en Fluyo</button>
  </div>
</section>

<footer id="brand">
  <a href="../" data-i18n="viewer.madeWith">Hecho con Fluyo</a>
</footer>

<!-- Core compartido (idéntico al del editor, sin módulos de edición).
     NO cargar aquí: state.js, editor-runtime.js, selection.js,
     interaction.js, ui.js ni export.js. -->
<!-- FLUYO-I18N-001: idioma de la interfaz (diccionarios → runtime), antes que quien pinta texto. -->
<script src="../js/i18n-en.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/config.js"></script>
<script src="../js/safe-svg.js"></script>
<script src="../js/model.js"></script>
<script src="../js/link-codec.js"></script>
<script src="../js/geometry.js"></script>
<!-- FLUYO-019.2: la piel «construido» (2.5D) es un ajuste del documento (settings.skin): el Viewer pinta lo que diga el
     documento compartido, sin conmutador. Puro, sin DOM; misma posición que en el editor (geometry → skin → render). -->
<script src="../js/skin.js"></script>
<script src="../js/render.js"></script>
<!-- Reproducción de la Historia: el MISMO motor, playback y receta que el editor y Present. -->
<script src="../js/scenario-engine.js"></script>
<script src="../js/scenario-playback.js"></script>
<script src="../js/story-playback.js"></script>
<script src="../js/story-clock.js"></script>
<!-- SCENARIOS-SEMANTICS-001 FASE 5 (D7): el módulo puro de la ruta observada (no es kernel), la misma receta que el editor y Present. -->
<script src="../js/flow-semantics.js"></script>
<!-- Transporte de telemetría puro (sin instrumentación de edición). -->
<script src="../js/analytics.js"></script>
<!-- Viewer: loader del share, viewport y runtime read-only. -->
<script src="../js/share-loader.js"></script>
<script src="../js/viewer-viewport.js"></script>
<script src="../js/viewer.js"></script>
</body>
</html>
