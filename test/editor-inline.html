<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Test — edición in-situ y autoescalado</title>
<!--
  Test del editor in-situ (A3) y del autoescalado de la etiqueta (A1).

  Sin runner, sin dependencias y sin paso de compilación: carga el index.html real
  en un iframe y comprueba contra el DOM y el motor de verdad. Es la única forma
  honesta de fijar lo que este test fija —que el textarea hereda tipografía,
  tamaño y posición del nodo—, porque eso solo existe en el navegador: ni el MCP
  ni un test en Node tienen textarea que medir.

  Cómo se ejecuta: hace falta servirlo por HTTP, no abrirlo con file://. Un
  iframe file:// dentro de otro file:// es origen opaco en Chrome y el test no
  podría leer el documento de dentro.

      npx serve .      (o cualquier servidor estático)
      -> http://localhost:PUERTO/test/editor-inline.html

  Este directorio no se publica: no está en sitemap.xml ni en la lista ASSETS del
  service worker.
-->
<style>
  body{background:#161616;color:#ededed;font:14px/1.5 system-ui;margin:0;padding:20px 24px}
  h1{font-size:18px;margin:0 0 4px}
  p.lead{color:#999;margin:0 0 16px;font-size:13px}
  #res{border-collapse:collapse;width:100%;max-width:960px;font-size:13px}
  #res td{padding:5px 10px;border-bottom:1px solid #2a2a2a;vertical-align:top}
  #res td:first-child{width:26px;text-align:center;font-weight:700}
  .ok{color:#7bb85b} .ko{color:#d0576a}
  .det{color:#888;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  #sum{margin:14px 0 0;font-size:15px;font-weight:600}
  iframe{position:fixed;left:-3000px;top:0;width:1200px;height:800px;border:0}
</style>
</head>
<body>
<h1>Edición in-situ y autoescalado</h1>
<p class="lead">Carga <code>../index.html</code> real en un iframe y comprueba contra su DOM. Requiere servirlo por HTTP.</p>
<table id="res"></table>
<p id="sum">Ejecutando…</p>
<iframe id="app"></iframe>

<script>
const tabla=document.getElementById("res");
let ok=0, ko=0;
function check(nombre, cond, detalle){
  const tr=tabla.insertRow();
  const c0=tr.insertCell(), c1=tr.insertCell();
  c0.textContent = cond ? "✓" : "✗";
  c0.className = cond ? "ok" : "ko";
  c1.innerHTML = nombre + (detalle ? `<br><span class="det">${detalle}</span>` : "");
  cond ? ok++ : ko++;
  return cond;
}
const px=v=>Math.round(parseFloat(v)*100)/100;
const cerca=(a,b,tol=0.6)=>Math.abs(a-b)<=tol;

const iframe=document.getElementById("app");
iframe.addEventListener("load", ()=>{
  // El bucle de render arranca con requestAnimationFrame; se le deja un par de
  // fotogramas para que el lienzo tenga tamaño antes de medir nada.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ try{ run(); }catch(e){
    check("El test no llegó a ejecutarse", false, String(e && e.stack || e));
    fin();
  }}));
});

/* Fluyo es una PWA: index.html registra un service worker que precachea
   js/*.js. Sin desregistrarlo antes, el iframe recibe la copia cacheada y el
   test mide una versión del código que ya no existe en disco — que es
   exactamente lo que pasó la primera vez que se ejecutó esto: un fallo de Escape
   que en el archivo ya estaba arreglado. Un test que puede dar rojo sobre código
   viejo no vale para nada, así que la limpieza va antes de cargar el iframe. */
(async ()=>{
  try{
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){ /* sin SW ni Cache API el test sigue siendo válido */ }
  iframe.src="../index.html?test="+Date.now();
})();

function run(){
  const W=document.getElementById("app").contentWindow;
  const D=W.document;
  const box=D.getElementById("editBox");

  /* Los `const`/`let` de nivel superior de un script clásico NO se cuelgan de
     `window`: viven en el ámbito léxico global, que desde fuera solo se alcanza
     evaluando dentro. `ctx`, `viewZoom`, `viewX`, `viewY` y `editing` son de
     esos. Las `function` sí son propiedades de window y se llaman directamente. */
  const G = expr => W.eval(expr);
  const set = (nombre, valor) => W.eval(nombre + " = " + JSON.stringify(valor));

  /* ---------- A1 · el tamaño sale de las DOS dimensiones de la caja ---------- */

  const base=W.newNode("rect", 600, 400, {label:"Hola"});
  const medir=n=>W.measureNodeLabel(G("ctx"), n);
  const fsDe=n=>W.labelFontSize(n, medir(n));

  check("Un nodo sin redimensionar conserva el tamaño base (retrocompatibilidad)",
        cerca(fsDe(base), 17, 0.01), `rect 180x70 → fs ${fsDe(base).toFixed(2)}, esperado 17`);

  const doble=W.newNode("rect", 600, 700, {label:"Hola"});
  doble.w=360; doble.h=140;
  check("Al doblar la caja, la fuente dobla",
        cerca(fsDe(doble), 34, 0.01), `rect 360x140 → fs ${fsDe(doble).toFixed(2)}, esperado 34`);

  const anchoSolo=W.newNode("rect", 1200, 400, {label:"Hola"});
  anchoSolo.w=360; anchoSolo.h=70;
  check("Ensanchar sin subir el alto NO agranda la fuente: manda la dimensión menor",
        cerca(fsDe(anchoSolo), 17, 0.01),
        `rect 360x70 → fs ${fsDe(anchoSolo).toFixed(2)} · min(360/180, 70/70) = 1`);

  const chico=W.newNode("rect", 1200, 700, {label:"Hola"});
  chico.w=90; chico.h=35;
  check("Al reducir la caja, la fuente encoge",
        fsDe(chico) < 17, `rect 90x35 → fs ${fsDe(chico).toFixed(2)}`);

  // El encogimiento por ancho tiene suelo en 10px, igual que antes de A1: por
  // debajo de eso el texto deja de leerse y se prefiere que desborde.
  const largo=W.newNode("rect", 1800, 400, {label:"Una etiqueta bastante larga que no cabe"});
  check("El texto que no cabe a lo ancho sigue encogiendo, hasta el suelo de 10px",
        medir(largo)(fsDe(largo)) <= largo.w-18+0.5 || cerca(fsDe(largo), 10, 0.01),
        `fs ${fsDe(largo).toFixed(2)} · ancho del texto ${medir(largo)(fsDe(largo)).toFixed(1)} · disponible ${largo.w-18}`);

  const largoAncho=W.newNode("rect", 1800, 1900, {label:"Una etiqueta bastante larga que no cabe"});
  largoAncho.w=520; largoAncho.h=70;
  check("Con sitio de sobra, ese mismo texto cabe sin tocar el suelo",
        medir(largoAncho)(fsDe(largoAncho)) <= largoAncho.w-18+0.5 && fsDe(largoAncho) > 10,
        `fs ${fsDe(largoAncho).toFixed(2)} · ancho ${medir(largoAncho)(fsDe(largoAncho)).toFixed(1)} ≤ ${largoAncho.w-18}`);

  const altas=W.newNode("rect", 1800, 700, {label:"a\nb\nc\nd\ne"});
  check("Cinco líneas en una caja baja caben en alto (el límite que antes no existía)",
        5*fsDe(altas)*1.25 <= altas.h+0.5,
        `5 líneas x ${fsDe(altas).toFixed(1)}px x 1.25 = ${(5*fsDe(altas)*1.25).toFixed(1)} ≤ ${altas.h}`);

  const manual=W.newNode("rect", 2200, 400, {label:"Hola", fs:29});
  manual.w=360; manual.h=140;
  check("`fs` explícito sigue siendo la salida manual: no se calcula nada",
        fsDe(manual)===29, `fs declarado 29 → ${fsDe(manual)}`);

  const ico=W.newNode("icon", 2200, 700, {icon:"kafka", label:"Kafka"});
  ico.w=480; ico.h=368;   // x4
  check("La etiqueta de un icono no se come el glifo al agrandarlo",
        fsDe(ico) <= 26/1.25+0.01,
        `icon x4 → fs ${fsDe(ico).toFixed(2)}, tope de su franja ${(26/1.25).toFixed(2)}`);

  /* ---------- A3 · el textarea hereda del nodo ---------- */

  const n=W.newNode("rect", 600, 1100, {label:"Café", font:"Verdana, Geneva, sans-serif", bold:true});
  n.w=270; n.h=105;                       // x1.5 → fs 25.5
  W.openEditorAt({x:n.x, y:n.y});

  check("Editar abre el textarea", box.style.display==="block", `display: ${box.style.display}`);
  check("El textarea es el objeto en edición", G("editing")===n);

  const L=W.labelLayout(n, medir(n));
  const z=G("viewZoom");

  check("Hereda el TAMAÑO de fuente calculado, no un valor fijo",
        cerca(px(box.style.fontSize), L.fs*z),
        `textarea ${px(box.style.fontSize)}px · labelLayout ${(L.fs*z).toFixed(2)}px · antes eran 15px fijos`);

  check("Hereda la FAMILIA tipográfica del nodo",
        box.style.fontFamily.replace(/["']/g,"")===n.font.replace(/["']/g,""),
        `${box.style.fontFamily}`);

  check("Hereda el PESO del nodo",
        box.style.fontWeight==="bold", `font-weight: ${box.style.fontWeight}`);

  check("Hereda el INTERLINEADO de la maquetación",
        cerca(px(box.style.lineHeight), L.lh*z),
        `textarea ${px(box.style.lineHeight)}px · labelLayout ${(L.lh*z).toFixed(2)}px`);

  check("Se coloca en la POSICIÓN del texto, no en el centro del nodo",
        cerca(px(box.style.left), L.boxX*z+G("viewX")) && cerca(px(box.style.top), L.boxY*z+G("viewY")),
        `left ${px(box.style.left)} / esperado ${(L.boxX*z+G("viewX")).toFixed(2)} · ` +
        `top ${px(box.style.top)} / esperado ${(L.boxY*z+G("viewY")).toFixed(2)} · antes el top era un offset fijo de 16px`);

  check("Toma el ANCHO ÚTIL de la caja, el mismo que limita la fuente",
        cerca(px(box.style.width), L.boxW*z),
        `${px(box.style.width)}px · n.w-18 = ${L.boxW} x zoom`);

  const cs=W.getComputedStyle(box);
  check("Es TRANSPARENTE y sin borde: no tapa el diagrama",
        /rgba\(0, 0, 0, 0\)|transparent/.test(cs.backgroundColor) && (cs.borderStyle==="none"||px(cs.borderTopWidth)===0),
        `background ${cs.backgroundColor} · border ${cs.borderStyle} ${cs.borderTopWidth}`);

  check("Mientras se edita, el lienzo NO pinta esa etiqueta (si no, se ve doble)",
        G("editing")===n, "drawLabelLines() sale antes cuando editing === n");

  /* ---------- A3 · sigue al nodo cuando cambia ---------- */

  const fsAntes=px(box.style.fontSize);
  n.w=540; n.h=210;                        // x3
  W.syncEditBox();
  const L2=W.labelLayout(n, medir(n));
  check("Al redimensionar el nodo, el textarea se reajusta",
        px(box.style.fontSize)>fsAntes && cerca(px(box.style.fontSize), L2.fs*z),
        `${fsAntes}px → ${px(box.style.fontSize)}px al pasar de 270x105 a 540x210`);

  const zAntes=G("viewZoom");
  set("viewZoom", zAntes*2); W.syncEditBox();
  check("Al hacer zoom, el textarea sigue al texto",
        cerca(px(box.style.fontSize), L2.fs*G("viewZoom")),
        `zoom x2 → ${px(box.style.fontSize)}px`);
  set("viewZoom", zAntes); W.syncEditBox();

  /* ---------- A3 · acentos y ñ escribiendo en vivo ---------- */

  // Un acento con tecla muerta y un teclado CJK llegan como una COMPOSICIÓN: el
  // navegador manda compositionstart, va actualizando, y solo al final llega el
  // carácter compuesto. Escribir "n" + "~" no produce keydown de "ñ" en ningún
  // momento, así que un editor que se fíe de keydown se pierde el carácter.
  function escribirCompuesto(texto, pasos){
    box.dispatchEvent(new W.CompositionEvent("compositionstart", {bubbles:true}));
    for(const p of pasos){
      box.value = texto + p;
      box.dispatchEvent(new W.CompositionEvent("compositionupdate", {bubbles:true, data:p}));
      box.dispatchEvent(new W.InputEvent("input", {bubbles:true, isComposing:true, data:p}));
    }
    box.dispatchEvent(new W.CompositionEvent("compositionend", {bubbles:true, data:pasos[pasos.length-1]}));
    box.dispatchEvent(new W.InputEvent("input", {bubbles:true, isComposing:false}));
  }

  box.value=""; escribirCompuesto("", ["n","ñ"]);
  check("Una ñ compuesta con tecla muerta llega al nodo",
        n.label==="ñ", `label del nodo: ${JSON.stringify(n.label)}`);

  box.value="Cami"; escribirCompuesto("Cami", ["o","ó"]);
  check("Un acento compuesto llega al nodo",
        n.label==="Camió", `label del nodo: ${JSON.stringify(n.label)}`);

  // Enter durante una composición es del compositor: confirma el candidato, no
  // el texto. Robárselo es lo que rompe los acentos y los teclados CJK.
  box.value="Señor";
  box.dispatchEvent(new W.InputEvent("input", {bubbles:true}));
  const evComp=new W.KeyboardEvent("keydown", {key:"Enter", bubbles:true, cancelable:true, isComposing:true});
  box.dispatchEvent(evComp);
  check("Enter DURANTE una composición no cierra el editor: es del compositor",
        G("editing")===n && !evComp.defaultPrevented, `editing sigue abierto: ${G("editing")===n}`);

  box.dispatchEvent(new W.KeyboardEvent("keydown", {key:"Enter", bubbles:true, cancelable:true}));
  check("Enter FUERA de una composición confirma y cierra",
        G("editing")===null && n.label==="Señor" && box.style.display==="none",
        `label ${JSON.stringify(n.label)} · display ${box.style.display}`);

  /* ---------- A3 · Escape restaura ---------- */

  const m=W.newNode("rect", 1400, 1100, {label:"Original"});
  W.openEditorAt({x:m.x, y:m.y});
  box.value="Manchado";
  box.dispatchEvent(new W.InputEvent("input", {bubbles:true}));
  const antesDeEsc=m.label;
  box.dispatchEvent(new W.KeyboardEvent("keydown", {key:"Escape", bubbles:true, cancelable:true}));
  check("El texto se aplica en vivo (se ve el reajuste mientras escribes)",
        antesDeEsc==="Manchado", `durante la edición: ${JSON.stringify(antesDeEsc)}`);
  check("Escape restaura el texto original",
        m.label==="Original" && G("editing")===null, `label ${JSON.stringify(m.label)}`);

  /* ---------- A3 · aristas ---------- */

  const a=W.newNode("rect", 300, 1500, {label:"A"}), b=W.newNode("rect", 900, 1500, {label:"B"});
  const e=W.newEdge(a.id, b.id); e.label="evento";
  W.openEditorAt(W.labelPointFor(e, W.edgePoints(e)));
  check("Una etiqueta de arista también se edita in-situ",
        G("editing")===e && box.style.display==="block", `editing es la arista: ${G("editing")===e}`);
  check("Y usa el tamaño de la arista, que no escala con ninguna caja",
        cerca(px(box.style.fontSize), W.edgeLabelFs(e)*G("viewZoom")),
        `${px(box.style.fontSize)}px · edgeLabelFs ${W.edgeLabelFs(e)} x zoom`);
  box.dispatchEvent(new W.KeyboardEvent("keydown", {key:"Escape", bubbles:true, cancelable:true}));

  /* ---------- U2 · manejadores de extremo ----------

     getBoundingClientRect() sobre un elemento del iframe devuelve coordenadas
     del viewport de ESE documento, no del de fuera, así que sirve tal cual para
     construir los clientX/clientY que el handler de dentro va a leer — aunque
     el iframe esté aparcado en left:-3000px. */
  const cvA=D.getElementById("cv");
  const aPantalla=p=>{
    const r=cvA.getBoundingClientRect();
    return {clientX:p.x*G("viewZoom")+G("viewX")+r.left, clientY:p.y*G("viewZoom")+G("viewY")+r.top};
  };
  const gesto=(ed,cual,destino)=>{
    const pp=W.edgePoints(ed), origen = cual==="from" ? pp[0] : pp[pp.length-1];
    for(const [tipo,punto] of [["pointerdown",origen],["pointermove",destino],["pointerup",destino]]){
      cvA.dispatchEvent(new W.PointerEvent(tipo, Object.assign(
        {pointerType:"mouse", button:0, bubbles:true, cancelable:true, isPrimary:true, pointerId:1},
        aPantalla(punto))));
    }
  };
  const limpiar=()=>{ G("P()").nodes.length=0; G("P()").edges.length=0; G("P()").nextId=1; W.clearSel(); };

  limpiar();
  const uA=W.newNode("rect",400,400,{label:"A"}), uB=W.newNode("rect",800,300,{label:"B"});
  const ar=W.newEdge(uA.id,uB.id,{fromSide:"e",toSide:"n",route:"ortho"});
  W.selectOnly("edge",ar.id);
  const ptsAr=W.edgePoints(ar), ultimo=ptsAr.length-2;

  check("Los extremos de una arista tienen manejador propio, sobre el borde",
        W.hitEdgeEnd(ar,ptsAr[0].x,ptsAr[0].y)==="from" &&
        W.hitEdgeEnd(ar,ptsAr[ptsAr.length-1].x,ptsAr[ptsAr.length-1].y)==="to");

  check("El pasillo de aproximación ya no lleva manejador de codo",
        W.bendableSegs(ar,ptsAr).indexOf(0)===-1 && W.bendableSegs(ar,ptsAr).indexOf(ultimo)===-1,
        `tramos con codo [${W.bendableSegs(ar,ptsAr).join(",")}] de 0..${ultimo}`);

  check("Y ahí ya no hay nada que agarrar: ni tramo ni extremo",
        W.hitSegment(ar, ptsAr[0].x+14, ptsAr[0].y)===-1 &&
        W.hitEdgeEnd(ar, ptsAr[0].x+14, ptsAr[0].y)===null,
        "el punto que antes flotaba a 14px del borde");

  const oesteB=W.sidePoint(uB,"w");
  gesto(ar,"to",{x:oesteB.x-4, y:oesteB.y});
  check("Arrastrar un extremo cambia el lado y NO genera waypoints",
        ar.toSide==="w" && (ar.waypoints||[]).length===0,
        `toSide ${JSON.stringify(ar.toSide)} · waypoints ${(ar.waypoints||[]).length}`);

  const uC=W.newNode("rect",800,700,{label:"C"});
  gesto(ar,"to",{x:W.sidePoint(uC,"w").x-4, y:W.sidePoint(uC,"w").y});
  check("Soltarlo sobre otra forma reengancha la arista",
        ar.to===uC.id && (ar.waypoints||[]).length===0,
        `to=${ar.to}, esperado ${uC.id}`);

  const lazo={from:ar.from, to:ar.to};
  gesto(ar,"from",{x:W.sidePoint(uC,"e").x+4, y:W.sidePoint(uC,"e").y});
  check("Soltar un extremo sobre el nodo del otro se rechaza (from === to)",
        ar.from===lazo.from && ar.to===lazo.to,
        `from=${ar.from} to=${ar.to}, sin cambio respecto a from=${lazo.from} to=${lazo.to}`);

  gesto(ar,"to",{x:uC.x, y:uC.y});
  check("Soltar lejos de un lado deja la conexión flotante",
        ar.toSide===null, `toSide ${JSON.stringify(ar.toSide)}`);

  const intacto={from:ar.from, to:ar.to, fromSide:ar.fromSide, toSide:ar.toSide};
  gesto(ar,"to",{x:2100, y:1250});
  check("Soltar en el vacío no cambia nada: abandonar no es desconectar",
        ar.from===intacto.from && ar.to===intacto.to &&
        ar.fromSide===intacto.fromSide && ar.toSide===intacto.toSide &&
        (ar.waypoints||[]).length===0);

  /* La razón de que el arrastre no pueda generar waypoints: con ellos la arista
     sale del reparto de carriles, y al quedar `sib.length<2` su hermana también
     — que se movía 14px sin que nadie la tocara. */
  limpiar();
  const pA=W.newNode("rect",300,400,{label:"A"}), pB=W.newNode("rect",800,400,{label:"B"});
  const g1=W.newEdge(pA.id,pB.id), g2=W.newEdge(pA.id,pB.id);
  const yHermana=W.edgePoints(g1)[0].y;
  W.selectOnly("edge",g2.id);
  gesto(g2,"to",{x:W.sidePoint(pB,"n").x, y:W.sidePoint(pB,"n").y-2});
  check("Mover un extremo no descoloca a la hermana de un par paralelo",
        cerca(W.edgePoints(g1)[0].y, yHermana, 0.01) && (g2.waypoints||[]).length===0,
        `hermana y=${W.edgePoints(g1)[0].y.toFixed(1)}, antes ${yHermana.toFixed(1)}`);

  /* ---------- Deslizar un tramo de ruta ortogonal ----------

     El manejador de un tramo ya no inserta un vértice donde agarras: desliza el
     tramo entero por su perpendicular. Lo que se comprueba aquí es lo que se
     rompía antes — que la ruta siga siendo ortogonal después del gesto. */
  const diagonales=ps=>{
    let n=0;
    for(let i=1;i<ps.length;i++){
      if(Math.abs(ps[i].x-ps[i-1].x)>1.5 && Math.abs(ps[i].y-ps[i-1].y)>1.5) n++;
    }
    return n;
  };
  const invierte=ps=>{
    for(let i=2;i<ps.length;i++){
      const ax=ps[i-1].x-ps[i-2].x, ay=ps[i-1].y-ps[i-2].y;
      const bx=ps[i].x-ps[i-1].x,   by=ps[i].y-ps[i-1].y;
      if(ax*bx+ay*by<-1e-9) return true;
    }
    return false;
  };
  const arrastraTramo=(ed,i,destino,soltar)=>{
    const pp=W.edgePoints(ed);
    const agarre={x:(pp[i].x+pp[i+1].x)/2, y:(pp[i].y+pp[i+1].y)/2};
    const pasos=[["pointerdown",agarre],["pointermove",destino]];
    if(soltar!==false) pasos.push(["pointerup",destino]);
    for(const [tipo,punto] of pasos){
      cvA.dispatchEvent(new W.PointerEvent(tipo, Object.assign(
        {pointerType:"mouse", button:0, bubbles:true, cancelable:true, isPrimary:true, pointerId:1},
        aPantalla(punto))));
    }
  };

  limpiar();
  const tA=W.newNode("rect",400,500,{label:"A"}), tB=W.newNode("rect",800,300,{label:"B"});
  tB.w=240; tB.h=110;
  const tr=W.newEdge(tA.id,tB.id,{fromSide:"e",toSide:"n",route:"ortho"});
  W.selectOnly("edge",tr.id);
  let ptsTr=W.edgePoints(tr);
  const central=W.bendableSegs(tr,ptsTr)[1];
  const medio={x:(ptsTr[central].x+ptsTr[central+1].x)/2, y:(ptsTr[central].y+ptsTr[central+1].y)/2};

  check("El tramo se agarra en toda la barra, no solo en su punto medio",
        W.hitSegment(tr, medio.x+20, medio.y)===central &&
        W.hitSegment(tr, medio.x-20, medio.y)===central,
        `SEG_GRIP=${W.SEG_GRIP}`);

  arrastraTramo(tr,central,{x:medio.x, y:medio.y-60});
  ptsTr=W.edgePoints(tr);
  check("Arrastrarlo desplaza el tramo entero y la ruta sigue ortogonal",
        diagonales(ptsTr)===0 && !invierte(ptsTr),
        ptsTr.map(q=>`(${q.x.toFixed(0)},${q.y.toFixed(0)})`).join(" "));

  /* El tope. Sin él, el gesto reintroduce el muñón de 28px que orthoRoute()
     dejó de producir: una arista con waypoints ya no pasa por el router, así
     que el guardián de allí no la protege. */
  limpiar();
  const sA=W.newNode("rect",400,500,{label:"A"}), sB=W.newNode("rect",800,300,{label:"B"});
  sB.w=240; sB.h=110;
  const sr=W.newEdge(sA.id,sB.id,{fromSide:"n",toSide:"s",route:"ortho"});
  W.selectOnly("edge",sr.id);
  const canal=W.bendableSegs(sr,W.edgePoints(sr))[1];
  arrastraTramo(sr,canal,{x:400, y:-4000});
  const ptsSr=W.edgePoints(sr);
  check("El tramo topa antes de cruzar el pasillo, sin dejar muñón",
        !invierte(ptsSr) && diagonales(ptsSr)===0,
        ptsSr.map(q=>`(${q.x.toFixed(0)},${q.y.toFixed(0)})`).join(" "));

  /* Con un extremo flotante, autoAnchor recalcula el ancla apuntando al primer
     waypoint: el extremo se movería mientras arrastras y ninguna alineación
     aguantaría. Por eso el gesto congela el lado antes de tocar nada. */
  limpiar();
  const fA=W.newNode("rect",400,500,{label:"A"}), fB=W.newNode("rect",800,300,{label:"B"});
  fB.w=240; fB.h=110;
  const fr=W.newEdge(fA.id,fB.id,{fromSide:null,toSide:null,route:"ortho"});
  W.selectOnly("edge",fr.id);
  const fSeg=W.bendableSegs(fr,W.edgePoints(fr))[1];
  arrastraTramo(fr,fSeg,{x:600, y:360});
  const ptsFr=W.edgePoints(fr);
  check("Un extremo flotante se congela al empezar, y la ruta no sale en diagonal",
        fr.fromSide!==null && fr.toSide!==null && diagonales(ptsFr)===0,
        `fromSide ${JSON.stringify(fr.fromSide)} toSide ${JSON.stringify(fr.toSide)} · ` +
        ptsFr.map(q=>`(${q.x.toFixed(0)},${q.y.toFixed(0)})`).join(" "));

  /* Escape a mitad del gesto sí necesita undo(): a diferencia del arrastre de
     extremo, éste muta el documento mientras dura. */
  limpiar();
  const eA=W.newNode("rect",400,500,{label:"A"}), eB=W.newNode("rect",800,300,{label:"B"});
  eB.w=240; eB.h=110;
  const er=W.newEdge(eA.id,eB.id,{fromSide:"e",toSide:"n",route:"ortho"});
  W.selectOnly("edge",er.id);
  const eSeg=W.bendableSegs(er,W.edgePoints(er))[1];
  arrastraTramo(er,eSeg,{x:600, y:120}, false);
  D.dispatchEvent(new W.KeyboardEvent("keydown",{key:"Escape", bubbles:true, cancelable:true}));
  /* undo() pasa por applySnap(), que REEMPLAZA pg.edges por copias profundas:
     `er` queda obsoleta y hay que volver a buscar la arista por id. Mirar la
     referencia vieja daba rojo con el código en verde. */
  const erTras=G("P()").edges.find(x=>x.id===er.id);
  check("Escape a mitad devuelve la arista a su ruta automática",
        erTras && (erTras.waypoints||[]).length===0 && erTras.fromSide==="e" && erTras.toSide==="n",
        `waypoints ${erTras?(erTras.waypoints||[]).length:"arista perdida"}`);

  /* Mover un nodo ya NO borra la ruta hecha a mano. Esa rama hacía
     `e.waypoints=[]` desde b1d7d27; ahora los waypoints se quedan y solo se
     realinea el que toca cada ancla. */
  limpiar();
  const mA=W.newNode("rect",400,500,{label:"A"}), mB=W.newNode("rect",800,300,{label:"B"});
  mB.w=240; mB.h=110;
  const mr=W.newEdge(mA.id,mB.id,{fromSide:"e",toSide:"n",route:"ortho"});
  W.selectOnly("edge",mr.id);
  const mSeg=W.bendableSegs(mr,W.edgePoints(mr))[1];
  arrastraTramo(mr,mSeg,{x:518, y:157});
  const escalonAntes=(mr.waypoints||[]).length>1 ? mr.waypoints[1].y : null;
  const nWpsAntes=(mr.waypoints||[]).length;
  // arrastrar el nodo DESTINO 200px a la derecha
  for(const [tipo,punto] of [["pointerdown",{x:mB.x,y:mB.y}],["pointermove",{x:mB.x+200,y:mB.y}],["pointerup",{x:mB.x+200,y:mB.y}]]){
    cvA.dispatchEvent(new W.PointerEvent(tipo, Object.assign(
      {pointerType:"mouse", button:0, bubbles:true, cancelable:true, isPrimary:true, pointerId:1},
      aPantalla(punto))));
  }
  const mrTras=G("P()").edges.find(x=>x.id===mr.id);
  const ptsMr=W.edgePoints(mrTras);
  check("Mover un nodo conserva la ruta hecha a mano en vez de borrarla",
        (mrTras.waypoints||[]).length===nWpsAntes && nWpsAntes>0,
        `waypoints ${nWpsAntes} → ${(mrTras.waypoints||[]).length}`);

  check("Y la conserva sin romper la ortogonalidad: el escalón mantiene su altura",
        diagonales(ptsMr)===0 && !invierte(ptsMr) &&
        mrTras.waypoints[1] && cerca(mrTras.waypoints[1].y, escalonAntes, 0.01),
        `escalón y=${mrTras.waypoints[1]?mrTras.waypoints[1].y:"?"}, antes ${escalonAntes} · ` +
        ptsMr.map(q=>`(${q.x.toFixed(0)},${q.y.toFixed(0)})`).join(" "));

  /* La salida cuando una ruta conservada ya no sirve. Desde que las rutas se
     conservan al mover los nodos, esto dejó de ser un rincón del panel. */
  check("Y R devuelve la flecha a su ruta automática, con undo",
        (()=>{
          // tras arrastrar el nodo, lo seleccionado es el NODO: hay que volver a
          // elegir la flecha, igual que haría el usuario
          W.selectOnly("edge",mr.id);
          const antesUndo=G("undoStack").length;
          D.dispatchEvent(new W.KeyboardEvent("keydown",{key:"r", bubbles:true, cancelable:true}));
          const ed=G("P()").edges.find(x=>x.id===mr.id);
          return (ed.waypoints||[]).length===0 && G("undoStack").length>antesUndo;
        })(),
        "el mismo camino que el botón del panel");

  /* Mover los DOS nodos a la vez ya conservaba la forma, trasladando los
     waypoints con el grupo. Esa rama no se ha tocado. */
  limpiar();
  const gA=W.newNode("rect",400,500,{label:"A"}), gB=W.newNode("rect",800,300,{label:"B"});
  gB.w=240; gB.h=110;
  const gr=W.newEdge(gA.id,gB.id,{fromSide:"e",toSide:"n",route:"ortho"});
  W.selectOnly("edge",gr.id);
  arrastraTramo(gr,W.bendableSegs(gr,W.edgePoints(gr))[1],{x:518, y:157});
  const nGrupo=(gr.waypoints||[]).length;
  W.selectOnly("node",gA.id); W.toggleSel("node",gB.id);
  for(const [tipo,punto] of [["pointerdown",{x:gA.x,y:gA.y}],["pointermove",{x:gA.x+120,y:gA.y}],["pointerup",{x:gA.x+120,y:gA.y}]]){
    cvA.dispatchEvent(new W.PointerEvent(tipo, Object.assign(
      {pointerType:"mouse", button:0, bubbles:true, cancelable:true, isPrimary:true, pointerId:1},
      aPantalla(punto))));
  }
  const grTras=G("P()").edges.find(x=>x.id===gr.id);
  check("Mover los dos nodos a la vez sigue trasladando los codos con el grupo",
        (grTras.waypoints||[]).length===nGrupo && diagonales(W.edgePoints(grTras))===0,
        `waypoints ${nGrupo} → ${(grTras.waypoints||[]).length}`);

  /* En una ruta recta no hay canales que deslizar, y un codo en diagonal es
     justo lo que ahí se quiere. */
  limpiar();
  const rA=W.newNode("rect",400,400,{label:"A"}), rB=W.newNode("rect",800,400,{label:"B"});
  const rr=W.newEdge(rA.id,rB.id,{route:"straight"});
  W.selectOnly("edge",rr.id);
  arrastraTramo(rr,0,{x:600, y:250});
  check("En una ruta recta el manejador sigue insertando un codo libre",
        (rr.waypoints||[]).length===1,
        `waypoints ${(rr.waypoints||[]).length}`);

  /* ---------- U3 · flechas de conexión con nodos superpuestos ---------- */

  limpiar();
  const contenedor=W.newNode("rect",800,400,{label:"contenedor"}); contenedor.w=600; contenedor.h=400;
  const interior=W.newNode("rect",800,400,{label:"dentro"});      interior.w=140;  interior.h=60;
  const flecha=W.sidePoint(interior,"n");
  const pf={x:flecha.x, y:flecha.y-24};   // ARROW_OFF por encima del borde del pequeño
  check("Con dos cajas superpuestas, la flecha del nodo de dentro es alcanzable",
        W.hitSideArrowHost(pf.x,pf.y)===interior && W.hitNode(pf.x,pf.y)===contenedor,
        `arrowHost «${(W.hitSideArrowHost(pf.x,pf.y)||{}).label}» aunque hitNode dé «${(W.hitNode(pf.x,pf.y)||{}).label}»`);

  /* ---------- U1 · papelera táctil ---------- */

  const papelera=D.getElementById("btnDelTouch");
  W.selectOnly("node",interior.id);
  set("lastPointerType","mouse"); W.syncTouchDelete();
  const conRaton=W.getComputedStyle(papelera).display;
  set("lastPointerType","touch"); W.syncTouchDelete();
  const conDedo=W.getComputedStyle(papelera).display;
  check("La papelera flotante sale con el dedo y no con el ratón",
        conRaton==="none" && conDedo!=="none", `ratón: ${conRaton} · dedo: ${conDedo}`);

  const nAntes=G("P()").nodes.length;
  papelera.click();
  check("Y borra la selección al pulsarla, y se apaga sola",
        G("P()").nodes.length===nAntes-1 && W.getComputedStyle(papelera).display==="none",
        `${nAntes} → ${G("P()").nodes.length} nodos`);

  fin();
}

function fin(){
  const s=document.getElementById("sum");
  s.textContent = ko===0 ? `${ok}/${ok} en verde` : `${ok} en verde, ${ko} en rojo`;
  s.className = ko===0 ? "ok" : "ko";
  document.title = (ko===0 ? "OK " : "FALLA ") + ok + "/" + (ok+ko);
}
</script>
</body>
</html>
